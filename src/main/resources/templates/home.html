<!DOCTYPE html >
<html lang="en" class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>首頁</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full">
    <div class="min-h-full">
        <nav class="bg-gray-800">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center">
                        <div class="shrink-0">
                            <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company" class="size-8" />
                        </div>
                        <div class="ml-10 flex items-baseline space-x-4">
                            <a th:href="@{/}" aria-current="page" class="rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white">重新整理</a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4 text-white">
                <span class="text-sm">
                    歡迎，<span sec:authentication="name" class="font-bold text-indigo-400"></span>
                    (<span sec:authentication="principal.authorities" class="text-xs text-gray-400"></span>)
                </span>
                        <form th:action="@{/logout}" method="POST">
                            <button type="submit" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm font-medium text-white">登出</button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>


        </nav>

        <header class="relative bg-white shadow-sm">
            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                <h1 class="text-3xl font-bold tracking-tight text-gray-900 text-center">通訊錄</h1>
            </div>
        </header>
        <main>
            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

                <div th:if="${message}" class="bg-green-200 border border-green-400 border-solid mb-5 p-2 rounded">
                    <p th:text="${message}"></p>

                </div>


                <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-5 gap-4">
                    <a th:href="@{'/create'}" class="bg-blue-600 font-medium px-3 py-2 rounded-md text-sm text-white hover:bg-blue-800 text-center">
                        新增名單
                    </a>

                    <form th:action="@{/}" method="GET" class="flex gap-2">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="搜尋姓氏、名稱或信箱..."
                               class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
                        <button type="submit" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium">
                            搜尋
                        </button>
                        <a th:if="${keyword != null && keyword != ''}" th:href="@{/}"
                           class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-md text-sm font-medium flex items-center">
                            清除
                        </a>
                    </form>
                </div>
                <!-- Your content -->
                <table class="table-auto w-full">
                    <thead class="bg-gray-800 text-white uppercase">
                        <tr>
                            <th class="px-6 py-3 text-center">編號</th>
                            <th class="px-6 py-3 text-center">姓氏</th>
                            <th class="px-6 py-3 text-center">名稱</th>
                            <th class="px-6 py-3 text-center">信箱</th>
                            <th class="px-6 py-3 text-center">手機</th>
                            <th class="px-6 py-3 text-center">資料修改</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="bg-white border-b" th:each="customer:${allCustomers}">
                            <td class="px-6 py-5 text-center" th:text="${customer.id}"></td>
                            <td class="px-6 py-5 text-center" th:text="${customer.lastName}"></td>
                            <td class="px-6 py-5 text-center" th:text="${customer.firstName}"></td>
                            <td class="px-6 py-5 text-center" th:text="${customer.email}"></td>
                            <td class="px-6 py-5 text-center" th:text="${customer.phone}"></td>
                            <td class="px-6 py-5 text-center">

                                <a th:href="@{/customer/{id}(id=${customer.id})}"
                                   class="bg-green-600 font-medium hover:bg-green-700 px-3 py-2 rounded-md text-sm text-white mr-1">
                                    查看
                                </a>


                                <a th:href="@{/customer/{id}/edit(id=${customer.id})}"
                                class="bg-blue-600 font-medium hover:bg-blue-700 px-3 py-2 rounded-md text-sm text-white mr-1">
                                    編輯
                                </a>

                                <a sec:authorize="hasRole('ADMIN')"
                                   th:href="@{/customer/{id}/delete(id=${customer.id})}"
                                   class="bg-red-600 font-medium hover:bg-red-700 px-3 py-2 rounded-md text-sm text-white mr-1">
                                    刪除
                                </a>
                            </td>
                        </tr>

                    </tbody>

                </table>

                <div class="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6 mt-4 rounded-md shadow-sm">
                    <div class="flex flex-1 justify-between sm:hidden">
                        <a th:href="@{/(page=${currentPage - 1}, keyword=${keyword})}"
                           th:classappend="${currentPage == 1} ? 'pointer-events-none opacity-50' : ''"
                           class="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">上一頁</a>
                        <a th:href="@{/(page=${currentPage + 1}, keyword=${keyword})}"
                           th:classappend="${currentPage == totalPages || totalPages == 0} ? 'pointer-events-none opacity-50' : ''"
                           class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">下一頁</a>
                    </div>
                    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm text-gray-700">
                                顯示第 <span class="font-medium" th:text="${totalItems == 0 ? 0 : (currentPage - 1) * 5 + 1}">1</span> 到
                                <span class="font-medium" th:text="${currentPage * 5 > totalItems ? totalItems : currentPage * 5}">5</span> 筆，
                                共 <span class="font-medium" th:text="${totalItems}">20</span> 筆資料
                            </p>
                        </div>
                        <div>
                            <nav class="isolate inline-flex -space-x-px rounded-md shadow-xs" aria-label="Pagination">
                                <a th:href="@{/(page=${currentPage - 1}, keyword=${keyword})}"
                                   th:classappend="${currentPage == 1} ? 'pointer-events-none opacity-50' : ''"
                                   class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus:z-20 focus:outline-offset-0">
                                    &laquo; 上一頁
                                </a>

                                <span th:each="i : ${#numbers.sequence(1, totalPages > 0 ? totalPages : 1)}">
                                    <a th:href="@{/(page=${i}, keyword=${keyword})}"
                                       th:text="${i}"
                                       th:classappend="${currentPage == i} ? 'bg-indigo-600 text-white focus:z-20' : 'text-gray-900 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus:z-20'"
                                       class="relative inline-flex items-center px-4 py-2 text-sm font-semibold focus:outline-offset-0">1</a>
                                </span>

                                <a th:href="@{/(page=${currentPage + 1}, keyword=${keyword})}"
                                   th:classappend="${currentPage == totalPages || totalPages == 0} ? 'pointer-events-none opacity-50' : ''"
                                   class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 ring-1 ring-gray-300 ring-inset hover:bg-gray-50 focus:z-20 focus:outline-offset-0">
                                    下一頁 &raquo;
                                </a>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>



</body>
</html>
