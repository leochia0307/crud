<!DOCTYPE html >
<html lang="en" class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>首頁</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full">
<div class="min-h-full">
  <nav class="bg-gray-800">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center">
          <div class="shrink-0">
            <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="Your Company" class="size-8" />
          </div>
          <div class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-4">
              <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-white/5 hover:text-white" -->
              <a th:href="@{/}" aria-current="page" class="rounded-md bg-gray-900 px-3 py-2 text-sm font-medium text-white text-center" >返回首頁</a>
            </div>
          </div>
        </div>
      </div>
    </div>


  </nav>

  <header class="relative bg-white shadow-sm">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900"
          th:text="${customer.id == null ? '新增客戶' : customer.lastName + ' ' + customer.firstName}"
      ></h1>
    </div>
  </header>
  <main>
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <table class="table-auto w-full">
          <tr>
            <th class="uppercase border text-left px-6 bg-gray-800 text-white">編號</th>
            <td class="px-6 oy-4 border bg-white" th:text="${customer.id}"></td>
          </tr>

          <tr>
            <th class="uppercase border text-left px-6 bg-gray-800 text-white">姓氏</th>
            <td class="px-6 oy-4 border bg-white" th:text="${customer.lastName}"></td>
          </tr>

          <tr>
            <th class="uppercase border text-left px-6 bg-gray-800 text-white">名稱</th>
            <td class="px-6 oy-4 border bg-white" th:text="${customer.firstName}"></td>
          </tr>

          <tr>
            <th class="uppercase border text-left px-6 bg-gray-800 text-white">信箱</th>
            <td class="px-6 oy-4 border bg-white" th:text="${customer.email}"></td>
          </tr>

          <tr>
            <th class="uppercase border text-left px-6 bg-gray-800 text-white">手機號碼</th>
            <td class="px-6 oy-4 border bg-white" th:text="${customer.phone}"></td>
        </table>

    </div>
  </main>
</div>



</body>
</html>
