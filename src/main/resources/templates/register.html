<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>註冊</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow">
  <h2 class="text-center text-3xl font-extrabold text-gray-900">註冊新帳號</h2>

  <div th:if="${errorMessage}" class="bg-red-100 text-red-700 p-2 rounded text-sm text-center" th:text="${errorMessage}"></div>

  <form class="mt-8 space-y-6" th:action="@{/register}" th:object="${user}" method="POST">
    <div class="rounded-md shadow-sm">
      <div>
        <label class="block text-sm font-medium text-gray-700">帳號</label>
        <input type="text" th:field="*{username}" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-700">密碼</label>
        <input type="password" th:field="*{password}" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1"></p>
      </div>

      <div class="mt-4">
        <label class="block text-sm font-medium text-gray-700">身分角色</label>
        <select th:field="*{role}" class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
          <option value="USER">一般使用者 (僅限增、改、查)</option>
          <option value="ADMIN">管理員 (完整權限 CRUD)</option>
        </select>
      </div>
    </div>

    <div>
      <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
        註冊
      </button>
    </div>

    <div class="text-center text-sm">
      <a th:href="@{/login}" class="font-medium text-indigo-600 hover:text-indigo-500">已有帳號？返回登入</a>
    </div>
  </form>
</div>
</body>
</html>
