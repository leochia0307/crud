<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登入</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow">
    <h2 class="text-center text-3xl font-extrabold text-gray-900">通訊錄系統 - 登入</h2>

    <div th:if="${param.error}" class="bg-red-100 text-red-700 p-2 rounded text-sm text-center">
        帳號或密碼錯誤，請再試一次。
    </div>
    <div th:if="${param.success}" class="bg-green-100 text-green-700 p-2 rounded text-sm text-center">
        註冊成功！請在此登入。
    </div>
    <div th:if="${param.logout}" class="bg-blue-100 text-blue-700 p-2 rounded text-sm text-center">
        您已成功登出。
    </div>

    <form class="mt-8 space-y-6" th:action="@{/login}" method="POST">
        <div class="rounded-md shadow-sm -space-y-px">
            <div>
                <label for="username" class="sr-only">帳號</label>
                <input id="username" name="username" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="帳號">
            </div>
            <div class="mt-3">
                <label for="password" class="sr-only">密碼</label>
                <input id="password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="密碼">
            </div>
        </div>

        <div>
            <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                登入
            </button>
        </div>

        <div class="text-center text-sm">
            <a th:href="@{/register}" class="font-medium text-indigo-600 hover:text-indigo-500">還沒有帳號？點此註冊</a>
        </div>
    </form>
</div>
</body>
</html>
